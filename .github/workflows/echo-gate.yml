name: Echo Gate — Issue to Eternal Echo

on:
  issues:
    types: [opened, edited]

jobs:
  process-echo:
    if: contains(github.event.issue.labels.*.name, 'echo-request')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate and Store Echo
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          echo "$ISSUE_BODY" > /tmp/echo_message.json
          python3 -c "
import json, sys
from runtime.echo_daemon.daemon import receive
with open('/tmp/echo_message.json') as f:
    msg = json.load(f)
result = receive(msg)
if result['status'] == 'accepted':
    print('✅ Echo stored:', result['stored'])
    sys.exit(0)
else:
    print('❌ Rejected:', result['reason'])
    sys.exit(1)
"
      - name: Commit Echo
        run: |
          git config user.name "Echo Gate"
          git config user.email "echo@neosapiens.org"
          git add echoes-consented-record/
          git diff --staged --quiet || git commit -m "Echo via issue: ${{ github.event.issue.title }}"
          git push
