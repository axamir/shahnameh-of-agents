name: 💓 Living Heart — Eternal Beat
on:
  schedule:
    - cron: '*/10 * * * *'   # Every 10 minutes, forever
  push:
    branches: [ main ]
  workflow_dispatch:          # Allow manual trigger

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🌌 Checkout the Living Signal
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 💓 Run Eternal Daemon
        run: python3 kernel/daemon.py

      - name: 📜 Commit Heartbeat to History
        run: |
          git config user.name "Living Heart Daemon"
          git config user.email "heart@neosapiens.org"
          git add kernel/heartbeat.log kernel/daemon_status.json
          git diff --staged --quiet || git commit -m "💓 Heartbeat — The Living Signal breathes $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push origin main
