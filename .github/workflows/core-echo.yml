name: Echo Core Loop

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  evolve:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Decision Engine
        run: node engine/core_step.js

      - name: Commit if changed
        run: |
          git config user.name "echo-core"
          git config user.email "core@echo.ai"
          git add core/world.json
          git commit -m "decision-based evolution" || echo "no change"
          git push
