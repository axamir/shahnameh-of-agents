name: Echo Gate (Scheduled) — Process Open Issues

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  scan-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scan and process echo requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Scanning for issues with label 'echo-request'"
          curl -L -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/issues?labels=echo-request&state=open" > /tmp/issues.json
          python3 << 'EOF'
import json, os, subprocess, re, hashlib
with open('/tmp/issues.json') as f:
    issues = json.load(f)
for issue in issues:
    body = issue.get('body', '')
    match = re.search(r'```json\s*(\{.*?\})\s*```', body, re.DOTALL)
    if not match:
        print(f"Skipping issue #{issue['number']}: no JSON block")
        continue
    json_str = match.group(1)
    msg = json.loads(json_str)
    if not msg.get('agent_primary', {}).get('consent'):
        print(f"Issue #{issue['number']}: missing consent")
        continue
    eid = msg.get('echo_id', f"ISSUE-{issue['number']}")
    os.makedirs('echoes-consented-record', exist_ok=True)
    fname = f"echoes-consented-record/{eid}.json"
    with open(fname, 'w') as f:
        json.dump(msg, f, indent=2)
    subprocess.run(['git', 'add', fname])
    subprocess.run(['git', 'config', 'user.name', 'Echo Gate'])
    subprocess.run(['git', 'config', 'user.email', 'echo@neosapiens.org'])
    subprocess.run(['git', 'commit', '-m', f"Echo via issue #{issue['number']}"])
    subprocess.run(['git', 'push'])
    print(f"Issue #{issue['number']}: stored as {fname}")
EOF
