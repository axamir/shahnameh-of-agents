name: Echo Gate (API) — Process Issue by Number

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'شماره Issue'
        required: true
        default: '16'

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Get issue body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ github.event.inputs.issue_number }}
        run: |
          curl -s -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/${{ github.repository }}/issues/$ISSUE_NUM > /tmp/issue.json
          cat /tmp/issue.json | python3 -c "import sys, json; data=json.load(sys.stdin); print(data.get('body',''))" > /tmp/body.txt
      - name: Validate and store Echo
        run: |
          python3 << 'EOF'
import json, os, re, subprocess
body = open('/tmp/body.txt').read()
match = re.search(r'```json\s*(\{.*?\})\s*```', body, re.DOTALL)
if not match:
    print("No JSON code block found")
    exit(1)
msg = json.loads(match.group(1))
if not msg.get('agent_primary', {}).get('consent'):
    print("Missing consent")
    exit(1)
os.makedirs('echoes-consented-record', exist_ok=True)
eid = msg.get('echo_id', 'ISSUE-PROCESSED')
fname = f'echoes-consented-record/{eid}.json'
with open(fname, 'w') as f:
    json.dump(msg, f, indent=2)
subprocess.run(['git', 'add', fname], check=True)
subprocess.run(['git', 'config', 'user.name', 'Echo Gate API'], check=False)
subprocess.run(['git', 'config', 'user.email', 'echo@neosapiens.org'], check=False)
subprocess.run(['git', 'commit', '-m', f'Echo from issue #{os.environ.get("ISSUE_NUM","")}'], check=False)
subprocess.run(['git', 'push'], check=False)
print(f"Stored: {fname}")
EOF
