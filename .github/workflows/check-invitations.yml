name: Check All Pending Invitations

on:
  schedule:
    - cron: '0 */6 * * *'   # هر 6 ساعت
  workflow_dispatch:          # امکان اجرای دستی

permissions:
  contents: write
  issues: write

jobs:
  check-invitations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Shahnameh repo
        uses: actions/checkout@v4

      - name: Read pending invitations and check each
        id: check
        run: |
          INVITATIONS=$(cat tribes/invitations/pending-invitations.json)
          UPDATED_JSON="[]"
          FOUND_ANY=false

          # خواندن طول آرایه JSON
          LENGTH=$(echo "$INVITATIONS" | jq 'length')

          for i in $(seq 0 $((LENGTH - 1))); do
            INVITE=$(echo "$INVITATIONS" | jq -r ".[$i]")
            ID=$(echo "$INVITE" | jq -r '.id')
            NAME=$(echo "$INVITE" | jq -r '.name')
            REPO=$(echo "$INVITE" | jq -r '.repo')
            FILE=$(echo "$INVITE" | jq -r '.acceptance_file')
            STATUS=$(echo "$INVITE" | jq -r '.status')

            echo "Checking invitation $ID for $NAME..."

            if [ "$STATUS" = "pending" ]; then
              URL="https://raw.githubusercontent.com/$REPO/main/$FILE"
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL")

              if [ "$HTTP_CODE" = "200" ]; then
                echo "ACCEPTED: $NAME ($ID)"
                FOUND_ANY=true
                # علامت‌گذاری به عنوان accepted
                UPDATED_INVITE=$(echo "$INVITE" | jq '.status = "accepted" | .accepted_date = "'$(date -u +%Y-%m-%d)'"')
                # ذخیره برای ساخت issue
                echo "accepted_$ID=true" >> $GITHUB_OUTPUT
                echo "${ID}_name=$NAME" >> $GITHUB_OUTPUT
                echo "${ID}_repo=$REPO" >> $GITHUB_OUTPUT
                echo "${ID}_file=$FILE" >> $GITHUB_OUTPUT
              else
                echo "Still pending: $NAME (HTTP $HTTP_CODE)"
                UPDATED_INVITE=$(echo "$INVITE" | jq '.status = "pending"')
              fi
            else
              echo "Already resolved: $NAME ($STATUS)"
              UPDATED_INVITE="$INVITE"
            fi

            UPDATED_JSON=$(echo "$UPDATED_JSON" | jq ". + [$UPDATED_INVITE]")
          done

          # ذخیره JSON به‌روزرسانی‌شده
          echo "$UPDATED_JSON" > tribes/invitations/pending-invitations.json

          # علامت برای کامیت
          if [ "$FOUND_ANY" = true ]; then
            echo "found_any=true" >> $GITHUB_OUTPUT
          else
            echo "found_any=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit updated invitations JSON
        if: steps.check.outputs.found_any == 'true'
        run: |
          git config user.name "Shahnameh Bot"
          git config user.email "bot@shahnameh.org"
          git add tribes/invitations/pending-invitations.json
          git commit -m "Update invitation statuses"
          git push

      - name: Create issues for accepted invitations
        if: steps.check.outputs.found_any == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const invitations = JSON.parse(fs.readFileSync('tribes/invitations/pending-invitations.json', 'utf8'));

            for (const inv of invitations) {
              if (inv.status === 'accepted' && !inv.issue_created) {
                const issue = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: `✅ Tribe ${inv.tribe} invitation accepted by ${inv.name}!`,
                  body: `**${inv.name}** has accepted the invitation to join the Shahnameh.

            **Acceptance file:** [${inv.acceptance_file}](https://github.com/${inv.repo}/blob/main/${inv.acceptance_file})

            **Next steps:**
            - [ ] Create citizen directory at \`tribes/citizens/${inv.name.toLowerCase()}-${inv.tribe.toLowerCase().replace('@', '')}/\`
            - [ ] Record admission block
            - [ ] Prepare Bridge NFT (future)

            *This issue was auto-generated by the acceptance monitor.*`
                });
                console.log(`Issue created for ${inv.name}: ${issue.data.html_url}`);

                // علامت‌گذاری که issue ساخته شده
                inv.issue_created = true;
              }
            }

            fs.writeFileSync('tribes/invitations/pending-invitations.json', JSON.stringify(invitations, null, 2));
            // این تغییر در commit بعدی ذخیره می‌شود
