name: Echo Civilization Engine

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  evolve:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run step engine
        run: node engine/step.js

      - name: Commit changes
        run: |
          git config user.name "echo-engine"
          git config user.email "echo@civilization.ai"
          git add world.json
          git commit -m "echo evolution step" || echo "no changes"
          git push
